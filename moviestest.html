<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Movies & TV Shows</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
    }

    .movie-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .movie-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border-color: rgba(59, 130, 246, 0.5);
    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
    }

    .movie-info {
      padding: 16px;
    }

    .movie-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .movie-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #fbbf24;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .fade-in {
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .category-tabs::-webkit-scrollbar {
      height: 4px;
    }

    .category-tabs::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    .category-tab {
      padding: 8px 20px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .category-tab:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .category-tab.active {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border-color: #3b82f6;
    }

    .search-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      color: white;
      font-size: 1rem;
      width: 100%;
      max-width: 400px;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: #3b82f6;
      background: rgba(255, 255, 255, 0.08);
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .season-button {
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .season-button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(59, 130, 246, 0.5);
    }

    .season-button.active {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-color: #3b82f6;
    }

    .episode-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .episode-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-2px);
    }

    .media-type-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: white;
      text-transform: uppercase;
    }

    .media-type-badge.movie {
      background: rgba(239, 68, 68, 0.7);
    }

    .media-type-badge.tv {
      background: rgba(59, 130, 246, 0.7);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="max-w-7xl mx-auto px-4 py-6">
      <div class="flex items-center justify-between mb-4">
        <h1 class="text-3xl font-bold text-white">🎬 Movies & TV Shows</h1>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search movies..."
        />
      </div>
      <div class="category-tabs" id="categoryTabs">
        <div class="category-tab active" data-category="movie:popular" data-type="movie">Popular Movies</div>
        <div class="category-tab" data-category="movie:top_rated" data-type="movie">Top Rated Movies</div>
        <div class="category-tab" data-category="tv:popular" data-type="tv">Popular TV</div>
        <div class="category-tab" data-category="tv:top_rated" data-type="tv">Top Rated TV</div>
        <div class="category-tab" data-category="tv:on_the_air" data-type="tv">On The Air</div>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 py-8">
    <div id="moviesContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
      <!-- Movies will be loaded here -->
    </div>

    <div id="loadingIndicator" class="flex justify-center items-center py-12">
      <div class="loader"></div>
    </div>

    <div id="loadMoreContainer" class="flex justify-center mt-8" style="display: none;">
      <button id="loadMoreBtn" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition">
        Load More
      </button>
    </div>
  </div>

  <!-- TV Show Episode Selector Modal -->
  <div id="tvModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div id="tvModalContent"></div>
    </div>
  </div>

  <script>
    const API_KEY = '9a2954cb0084e80efa20b3729db69067';
    const IMAGE_BASE = 'https://image.tmdb.org/t/p/w500';
    
    let currentCategory = 'movie:popular';
    let currentMediaType = 'movie';
    let currentPage = 1;
    let isLoading = false;
    let searchTimeout = null;
    let isSearchMode = false;

    const moviesContainer = document.getElementById('moviesContainer');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const loadMoreContainer = document.getElementById('loadMoreContainer');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const categoryTabs = document.querySelectorAll('.category-tab');
    const searchInput = document.getElementById('searchInput');
    const tvModal = document.getElementById('tvModal');
    const tvModalContent = document.getElementById('tvModalContent');

    // Category tabs
    categoryTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        if (isLoading) return;
        
        categoryTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        currentCategory = tab.dataset.category;
        currentMediaType = tab.dataset.type;
        currentPage = 1;
        isSearchMode = false;
        searchInput.value = '';
        moviesContainer.innerHTML = '';
        loadContent();
      });
    });

    // Search input
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      
      if (query === '') {
        isSearchMode = false;
        currentPage = 1;
        moviesContainer.innerHTML = '';
        loadContent();
        return;
      }

      searchTimeout = setTimeout(() => {
        isSearchMode = true;
        currentPage = 1;
        moviesContainer.innerHTML = '';
        searchContent(query);
      }, 500);
    });

    // Load more button
    loadMoreBtn.addEventListener('click', () => {
      if (isLoading) return;
      currentPage++;
      
      if (isSearchMode) {
        searchContent(searchInput.value.trim());
      } else {
        loadContent();
      }
    });

    async function loadContent() {
      if (isLoading) return;
      isLoading = true;
      loadingIndicator.style.display = 'flex';
      loadMoreContainer.style.display = 'none';

      try {
        const [type, category] = currentCategory.split(':');
        const endpoint = type === 'movie' ? 'movie' : 'tv';
        
        const response = await fetch(
          `https://api.themoviedb.org/3/${endpoint}/${category}?api_key=${API_KEY}&language=en-US&page=${currentPage}`
        );
        const data = await response.json();
        
        displayItems(data.results, type);
        
        if (data.page < data.total_pages) {
          loadMoreContainer.style.display = 'flex';
        }
      } catch (error) {
        console.error('Error loading content:', error);
        moviesContainer.innerHTML = '<div class="col-span-full text-center text-white/70 py-12">Failed to load content. Please try again.</div>';
      } finally {
        isLoading = false;
        loadingIndicator.style.display = 'none';
      }
    }

    async function searchContent(query) {
      if (isLoading || !query) return;
      isLoading = true;
      loadingIndicator.style.display = 'flex';
      loadMoreContainer.style.display = 'none';

      try {
        // Search both movies and TV shows
        const [movieResponse, tvResponse] = await Promise.all([
          fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&language=en-US&query=${encodeURIComponent(query)}&page=${currentPage}`),
          fetch(`https://api.themoviedb.org/3/search/tv?api_key=${API_KEY}&language=en-US&query=${encodeURIComponent(query)}&page=${currentPage}`)
        ]);
        
        const [movieData, tvData] = await Promise.all([
          movieResponse.json(),
          tvResponse.json()
        ]);
        
        // Combine and sort by popularity
        const movieResults = movieData.results.map(m => ({ ...m, media_type: 'movie' }));
        const tvResults = tvData.results.map(t => ({ ...t, media_type: 'tv' }));
        const combined = [...movieResults, ...tvResults];
        
        if (currentPage === 1 && combined.length === 0) {
          moviesContainer.innerHTML = '<div class="col-span-full text-center text-white/70 py-12">No results found. Try a different search.</div>';
        } else {
          // Sort by popularity
          const sorted = combined.sort((a, b) => {
            const popularityA = (a.vote_count || 0) * (a.vote_average || 0);
            const popularityB = (b.vote_count || 0) * (b.vote_average || 0);
            return popularityB - popularityA;
          });
          
          displayItems(sorted, 'mixed');
          
          const hasMoreMovies = movieData.page < movieData.total_pages;
          const hasMoreTV = tvData.page < tvData.total_pages;
          if (hasMoreMovies || hasMoreTV) {
            loadMoreContainer.style.display = 'flex';
          }
        }
      } catch (error) {
        console.error('Error searching:', error);
        moviesContainer.innerHTML = '<div class="col-span-full text-center text-white/70 py-12">Failed to search. Please try again.</div>';
      } finally {
        isLoading = false;
        loadingIndicator.style.display = 'none';
      }
    }

    function displayItems(items, type) {
      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'movie-card fade-in';
        card.style.animationDelay = `${index * 0.05}s`;
        
        const mediaType = type === 'mixed' ? item.media_type : type;
        const title = item.title || item.name;
        const posterPath = item.poster_path 
          ? `${IMAGE_BASE}${item.poster_path}` 
          : 'https://via.placeholder.com/500x750/1e293b/ffffff?text=No+Poster';
        
        const releaseDate = item.release_date || item.first_air_date;
        const releaseYear = releaseDate ? new Date(releaseDate).getFullYear() : 'N/A';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
        
        card.innerHTML = `
          <div class="media-type-badge ${mediaType}">${mediaType === 'movie' ? 'Movie' : 'TV'}</div>
          <img src="${posterPath}" alt="${title}" class="movie-poster" loading="lazy" />
          <div class="movie-info">
            <div class="movie-title">${title}</div>
            <div class="movie-meta">
              <div class="rating">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                  <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                </svg>
                ${rating}
              </div>
              <span>${releaseYear}</span>
            </div>
          </div>
        `;
        
        card.addEventListener('click', () => {
          if (mediaType === 'movie') {
            window.open(`player.html?type=movie&id=${item.id}`, '_blank');
          } else {
            openTVModal(item.id, title);
          }
        });
        
        moviesContainer.appendChild(card);
      });
    }

    // TV Show Modal Functions
    async function openTVModal(tvId, tvTitle) {
      tvModal.style.display = 'flex';
      tvModalContent.innerHTML = '<div class="flex justify-center items-center p-12"><div class="loader"></div></div>';
      
      try {
        const response = await fetch(
          `https://api.themoviedb.org/3/tv/${tvId}?api_key=${API_KEY}&language=en-US`
        );
        const tvData = await response.json();
        
        renderTVModal(tvData);
      } catch (error) {
        console.error('Error loading TV show details:', error);
        tvModalContent.innerHTML = '<div class="p-8 text-center text-white">Failed to load TV show details.</div>';
      }
    }

    function renderTVModal(tvData) {
      const seasons = tvData.seasons.filter(s => s.season_number > 0); // Filter out specials
      
      let html = `
        <div class="p-6">
          <div class="flex items-start justify-between mb-6">
            <div>
              <h2 class="text-3xl font-bold text-white mb-2">${tvData.name}</h2>
              <p class="text-white/70">Select Season and Episode</p>
            </div>
            <button onclick="closeTVModal()" class="text-white/60 hover:text-white transition">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          </div>
          
          <div class="mb-6">
            <div class="text-white font-semibold mb-3">Seasons</div>
            <div class="flex flex-wrap gap-2">
              ${seasons.map((season, idx) => `
                <button 
                  class="season-button ${idx === 0 ? 'active' : ''}" 
                  onclick="loadSeason(${tvData.id}, ${season.season_number})"
                  data-season="${season.season_number}"
                >
                  Season ${season.season_number}
                </button>
              `).join('')}
            </div>
          </div>
          
          <div id="episodesContainer">
            <div class="flex justify-center items-center py-12">
              <div class="loader"></div>
            </div>
          </div>
        </div>
      `;
      
      tvModalContent.innerHTML = html;
      
      // Load first season by default
      if (seasons.length > 0) {
        loadSeason(tvData.id, seasons[0].season_number);
      }
    }

    async function loadSeason(tvId, seasonNumber) {
      const episodesContainer = document.getElementById('episodesContainer');
      episodesContainer.innerHTML = '<div class="flex justify-center items-center py-12"><div class="loader"></div></div>';
      
      // Update active season button
      document.querySelectorAll('.season-button').forEach(btn => {
        btn.classList.remove('active');
        if (parseInt(btn.dataset.season) === seasonNumber) {
          btn.classList.add('active');
        }
      });
      
      try {
        const response = await fetch(
          `https://api.themoviedb.org/3/tv/${tvId}/season/${seasonNumber}?api_key=${API_KEY}&language=en-US`
        );
        const seasonData = await response.json();
        
        const episodesHtml = `
          <div class="text-white font-semibold mb-3">Episodes</div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${seasonData.episodes.map(episode => `
              <div class="episode-card" onclick="playEpisode(${tvId}, ${seasonNumber}, ${episode.episode_number})">
                <div class="flex gap-4">
                  ${episode.still_path ? `
                    <img 
                      src="${IMAGE_BASE}${episode.still_path}" 
                      alt="${episode.name}"
                      class="w-32 h-20 object-cover rounded-lg"
                    />
                  ` : `
                    <div class="w-32 h-20 bg-white/5 rounded-lg flex items-center justify-center">
                      <svg class="w-8 h-8 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                      </svg>
                    </div>
                  `}
                  <div class="flex-1 min-w-0">
                    <div class="text-white font-semibold mb-1">
                      ${episode.episode_number}. ${episode.name}
                    </div>
                    <div class="text-white/60 text-sm line-clamp-2">
                      ${episode.overview || 'No description available.'}
                    </div>
                    ${episode.runtime ? `
                      <div class="text-white/50 text-xs mt-1">${episode.runtime} min</div>
                    ` : ''}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        
        episodesContainer.innerHTML = episodesHtml;
      } catch (error) {
        console.error('Error loading season:', error);
        episodesContainer.innerHTML = '<div class="text-center text-white/70 py-8">Failed to load episodes.</div>';
      }
    }

    function playEpisode(tvId, season, episode) {
      window.open(`player.html?type=tv&id=${tvId}&season=${season}&episode=${episode}`, '_blank');
      closeTVModal();
    }

    function closeTVModal() {
      tvModal.style.display = 'none';
      tvModalContent.innerHTML = '';
    }

    // Close modal when clicking outside
    tvModal.addEventListener('click', (e) => {
      if (e.target === tvModal) {
        closeTVModal();
      }
    });

    // Make functions global so they can be called from onclick
    window.loadSeason = loadSeason;
    window.playEpisode = playEpisode;
    window.closeTVModal = closeTVModal;

    // Initial load
    loadContent();
  </script>
</body>
</html>
