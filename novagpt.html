<!DOCTYPE html>
<html>
<head>
  <title>ChatGPT API Chat</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 20px; }
    #chatbox { width: 600px; height: 400px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    #input { width: 500px; padding: 5px; }
    button { padding: 5px 10px; }
    .user { color: blue; }
    .bot { color: green; }
  </style>
</head>
<body>

<h2>ChatGPT Chat</h2>
<div id="chatbox"></div>
<input id="input" placeholder="Type your question..." />
<button onclick="send()">Send</button>

<script>
const apiKeyBase64 = "c2stcHJvai1QbktUb20tSVJZMWNrZmNfMEt3YWI1NmtMTmVmTzRLWVBYQ29UTFw1SHV4ZUFuUVVhWUhmd1VmWlBEN1pFZ2JGR2NOWThrc3R4MXVUM0JsYmtGSjBtbDZHZlh2T1dSZ25STVRxXzhleEhtdk5CaGZOSW90NzQyYVcxLWdKbm9VU2pUSTU0MGJGYVJFV05ZUGxwc1RkRWd2MS1PSWdB";
const apiKey = atob(apiKeyBase64);


async function send() {
  // now apiKey is ready to use
  const inputEl = document.getElementById("input");
  const userMessage = inputEl.value.trim();
  if (!userMessage) return;
  inputEl.value = "";

  addMessage(userMessage, "user");

  const response = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + apiKey
    },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      messages: [
        { role: "system", content: "You are a helpful teacher for schoolwork." },
        { role: "user", content: userMessage }
      ],
      max_tokens: 500
    })
  });

  const data = await response.json();
  addMessage(data.choices[0].message.content, "bot");
}

function addMessage(msg, sender="system") {
  const chatbox = document.getElementById("chatbox");
  const div = document.createElement("div");
  div.className = sender;
  div.innerHTML = msg.replace(/\n/g, "<br>");
  chatbox.appendChild(div);
  chatbox.scrollTop = chatbox.scrollHeight;
}
</script>


</body>
</html>
