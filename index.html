<script>
// Particle configurations (from math.html)
const particleConfigs = {
  default: {
    particles: {
      number: { value: 200, density: { enable: true, value_area: 600 } },
      color: { value: localStorage.getItem("particleColor") || "#0e00ff" },
      shape: { type: "circle" },
      opacity: { value: 0.5 },
      size: { value: 3, random: true },
      line_linked: {
        enable: true,
        distance: 150,
        color: localStorage.getItem("particleColor") || "#0e00ff",
        opacity: 0.4,
        width: 1.5
      },
      move: { enable: true, speed: 6, direction: "none", out_mode: "out" }
    },
    interactivity: {
      detect_on: "window",
      events: {
        onhover: { enable: true, mode: "grab" },
        onclick: { enable: true, mode: "repulse" },
        resize: true
      },
      modes: {
        grab: { distance: 180, line_linked: { opacity: 1 } },
        repulse: { distance: 200, duration: 0.4 }
      }
    },
    retina_detect: true
  },
  alt: {
    particles: {
      number: { value: 400, density: { enable: true, value_area: 800 } },
      color: { value: "#fff" },
      shape: {
        type: "circle",
        stroke: { width: 0, color: "#000000" },
        polygon: { nb_sides: 5 }
      },
      opacity: { value: 0.5, random: true },
      size: { value: 10, random: true },
      line_linked: { enable: false },
      move: {
        enable: true,
        speed: 6,
        direction: "bottom",
        out_mode: "out"
      }
    },
    interactivity: {
      detect_on: "window",
      events: {
        onhover: { enable: true, mode: "bubble" },
        onclick: { enable: true, mode: "repulse" },
        resize: true
      },
      modes: {
        bubble: { distance: 400, size: 4, duration: 0.3, opacity: 1, speed: 3 },
        repulse: { distance: 200, duration: 0.4 }
      }
    },
    retina_detect: true
  }
};

// Particles management
const _particlesDiv = document.getElementById("particles-js");

function destroyParticles() {
  if (window.pJSDom && window.pJSDom.length) {
    try { window.pJSDom[0].pJS.fn.vendors.destroypJS(); } catch(e){}
    window.pJSDom = [];
  }
  if (_particlesDiv) {
    _particlesDiv.style.display = 'none';
  }
}

function initParticles(mode = 'default') {
  const cfg = particleConfigs[mode] || particleConfigs.default;
  destroyParticles();

  if (_particlesDiv) {
    _particlesDiv.style.display = 'block';
  }

  let canvas = _particlesDiv.querySelector('canvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.className = 'particles-js-canvas-el';
    canvas.style.background = 'transparent';
    _particlesDiv.appendChild(canvas);
  }

  particlesJS('particles-js', cfg);
}

function applyParticlesState() {
  const enabled = localStorage.getItem('particlesEnabled');
  const mode = localStorage.getItem('particleMode') || 'default';

  if (enabled === 'false') {
    destroyParticles();
    if (_particlesDiv) _particlesDiv.style.display = 'none';
  } else {
    if (_particlesDiv) _particlesDiv.style.display = '';
    initParticles(mode);
  }
}

// Initialize particles on load
if (localStorage.getItem('particlesEnabled') === null) {
  localStorage.setItem('particlesEnabled', 'true');
}

// Wait for particles.js to load
function waitForParticlesLib() {
  if (typeof particlesJS !== 'undefined') {
    applyParticlesState();
  } else {
    setTimeout(waitForParticlesLib, 100);
  }
}
waitForParticlesLib();

// Settings overlay controls
document.addEventListener('DOMContentLoaded', () => {
  const settingsOverlay = document.getElementById('settingsOverlay');
  const closeSettingsBtn = document.getElementById('closeSettings');
  const settingsNavLink = document.getElementById('settingsNavLink');
  const toggleParticlesBtn = document.getElementById('toggle-particles');
  const switchBgBtn = document.getElementById('switch-background');
  const tabCloakBtn = document.getElementById('tab-cloak');
  const changeColorBtn = document.getElementById('change-particles-color');
  const toggleThemeBtn = document.getElementById('toggle-theme');

  function openOverlay() {
    if (!settingsOverlay) return;
    settingsOverlay.classList.add('active');
    settingsOverlay.setAttribute('aria-hidden','false');
  }

  function closeOverlay() {
    if (!settingsOverlay) return;
    settingsOverlay.classList.remove('active');
    settingsOverlay.setAttribute('aria-hidden','true');
  }

  // Open settings from sidebar
  settingsNavLink?.addEventListener('click', (e) => {
    e.preventDefault();
    openOverlay();
  });

  closeSettingsBtn?.addEventListener('click', closeOverlay);
  settingsOverlay?.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) closeOverlay();
  });

  // Toggle particles
  toggleParticlesBtn?.addEventListener('click', () => {
    const nowOn = localStorage.getItem('particlesEnabled') !== 'false';
    const next = !nowOn;
    localStorage.setItem('particlesEnabled', next ? 'true' : 'false');

    if (next) {
      if (_particlesDiv) _particlesDiv.style.display = '';
      initParticles(localStorage.getItem('particleMode') || 'default');
    } else {
      destroyParticles();
      if (_particlesDiv) _particlesDiv.style.display = 'none';
    }

    closeOverlay();
  });

  // Switch background
  switchBgBtn?.addEventListener('click', () => {
    const current = localStorage.getItem('particleMode') || 'default';
    const next = current === 'default' ? 'alt' : 'default';
    localStorage.setItem('particleMode', next);

    if (localStorage.getItem('particlesEnabled') !== 'false') {
      initParticles(next);
    }

    closeOverlay();
  });

  // Tab cloak
  function restoreTabCloak() {
    const savedTitle = localStorage.getItem("tabCloakTitle");
    const savedFavicon = localStorage.getItem("tabCloakFavicon");
    if (savedTitle) document.title = savedTitle;
    if (savedFavicon) {
      let favicon = document.querySelector("link[rel~='icon']");
      if (!favicon) {
        favicon = document.createElement("link");
        favicon.rel = "icon";
        document.head.appendChild(favicon);
      }
      favicon.href = savedFavicon;
    }
  }
  restoreTabCloak();

  tabCloakBtn?.addEventListener("click", () => {
    const newTitle = prompt("Enter new tab title:", document.title);
    if (newTitle !== null) {
      document.title = newTitle;
      localStorage.setItem("tabCloakTitle", newTitle);
    }

    const newFavicon = prompt("Enter new tab image URL (leave empty to keep current):", "");
    if (newFavicon !== null && newFavicon.trim() !== "") {
      let favicon = document.querySelector("link[rel~='icon']");
      if (!favicon) {
        favicon = document.createElement("link");
        favicon.rel = "icon";
        document.head.appendChild(favicon);
      }
      favicon.href = newFavicon;
      localStorage.setItem("tabCloakFavicon", newFavicon);
    }
  });

  // Change particle color
  function hexToRgb(hex) {
    const h = hex.replace("#", "");
    if (h.length === 3) {
      return {
        r: parseInt(h[0] + h[0], 16),
        g: parseInt(h[1] + h[1], 16),
        b: parseInt(h[2] + h[2], 16),
      };
    }
    if (h.length === 6) {
      return {
        r: parseInt(h.slice(0, 2), 16),
        g: parseInt(h.slice(2, 4), 16),
        b: parseInt(h.slice(4, 6), 16),
      };
    }
    return null;
  }

  function throttledLiveUpdate(newColor) {
    if (!(window.pJSDom && window.pJSDom[0] && window.pJSDom[0].pJS)) return;
    const pJS = window.pJSDom[0].pJS;

    pJS.particles.color.value = newColor;
    if (pJS.particles.line_linked) pJS.particles.line_linked.color = newColor;

    if (Array.isArray(pJS.particles.array)) {
      const rgb = hexToRgb(newColor);
      pJS.particles.array.forEach((p) => {
        p.color.value = newColor;
        if (rgb) p.color.rgb = rgb;
      });
    }

    if (pJS.fn?.particlesDraw) pJS.fn.particlesDraw();
  }

  function finalizeParticleColor(newColor) {
    try {
      localStorage.setItem("particleColor", newColor);
    } catch {}
    if (!(window.pJSDom && window.pJSDom[0] && window.pJSDom[0].pJS)) return;
    const pJS = window.pJSDom[0].pJS;

    throttledLiveUpdate(newColor);
    if (pJS.fn?.particlesRefresh) pJS.fn.particlesRefresh();
  }

  changeColorBtn?.addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "color";
    const saved = localStorage.getItem("particleColor") || "#0e00ff";
    input.value = saved;
    input.style.position = "fixed";
    input.style.left = "-9999px";
    document.body.appendChild(input);

    let lastUpdate = 0;
    input.addEventListener("input", (e) => {
      const now = Date.now();
      if (now - lastUpdate > 50) {
        throttledLiveUpdate(e.target.value);
        lastUpdate = now;
      }
    });

    input.addEventListener("change", (e) => {
      finalizeParticleColor(e.target.value);
      cleanup();
    });

    input.addEventListener("blur", cleanup);

    function cleanup() {
      setTimeout(() => {
        if (document.body.contains(input)) input.remove();
      }, 50);
    }

    input.click();
  });

  // Toggle theme
  toggleThemeBtn?.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    closeOverlay();
  });

  // Keyboard controls
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeOverlay();
    }
  });
});
</script>

<script>
let allGames = [];
const categories = ["trending","webports","shooter","strategy","survival","car","motox3m","other","sports","emulated","minecraft","bloons","run","ovo","vex","ducklife","fnaf","fnf","papalouie","twoplayer"];

// CDN URLs (matching old site)
const coverURL = "https://cdn.jsdelivr.net/gh/Notrexed/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/Notrexed/html@latest";

function createGameCard(game) {
    const card = document.createElement("div");
    card.className = "slide"; // keeps your existing styling
    card.onclick = () => openZone(game);

    let tagHTML = "";
    if(game.tag === "hot") tagHTML = `<a class='hotrank'><i class='bx bxs-hot'></i>HOT</a>`;
    if(game.tag === "new") tagHTML = `<a class='newrank'><i class='bx bxs-zap'></i>NEW</a>`;

    card.innerHTML = `${tagHTML}<img src="${game.img}" alt="${game.title}">`;

    return card;
}

async function loadGamesGrid() {
    const res = await fetch("https://cdn.jsdelivr.net/gh/NotRexed/assets@main/allzone.json");
    const rawGames = await res.json();

    allGames = rawGames.map(g => ({
        id: g.id,
        title: g.name,
        img: g.cover.replace("{COVER_URL}", coverURL),
        url: g.url.replace("{HTML_URL}", htmlURL),
        tag: g.tag || null,
        author: g.author || "Unknown",
        featured: g.featured || false
    }));

    // Sort alphabetically
    allGames.sort((a,b) => a.title.localeCompare(b.title));

    const featuredContainer = document.querySelector("#featuredGames .grid-container");
    const allContainer = document.querySelector("#allGames .grid-container");

    // Clear old content
    featuredContainer.innerHTML = "";
    allContainer.innerHTML = "";

    allGames.forEach(game => {
        // Create card for all games
        const allCard = document.createElement("div");
        allCard.className = "slide"; // keeps your styling
        allCard.onclick = () => openZone(game);

        let tagHTML = "";
        if(game.tag === "hot") tagHTML = `<a class='hotrank'><i class='bx bxs-hot'></i>HOT</a>`;
        if(game.tag === "new") tagHTML = `<a class='newrank'><i class='bx bxs-zap'></i>NEW</a>`;

allCard.innerHTML = `
  ${tagHTML}
  <div class="game-card-inner">
    <img src="${game.img}" alt="${game.title}">
    <div class="game-title">${game.title}</div>
  </div>
`;


        allContainer.appendChild(allCard);

        // If featured, create a separate card for featured grid
        if(game.featured) {
            const featuredCard = document.createElement("div");
            featuredCard.className = "slide"; // same styling
            featuredCard.onclick = () => openZone(game);
            featuredCard.innerHTML = `
  ${tagHTML}
  <div class="game-card-inner">
    <img src="${game.img}" alt="${game.title}">
    <div class="game-title">${game.title}</div>
  </div>
`;
            featuredContainer.appendChild(featuredCard);
        }
    });
}

loadGamesGrid();

</script>

<!-- Zone Viewer Functions (From Old Site) -->
<script>
let zoneFrame = document.getElementById('zoneFrame');
const zoneViewer = document.getElementById('zoneViewer');
const zoneNameEl = document.getElementById('zoneName');
const zoneIdEl = document.getElementById('zoneId');
const zoneAuthorEl = document.getElementById('zoneAuthor');
let currentZoneURL = '';

async function openZone(game) {
    if (!game) return;
    
    // Use the URL from the game object (already has placeholders replaced)
    currentZoneURL = game.url;
    
    console.log("Opening game:", game.title);
    console.log("Game URL:", currentZoneURL);
    
    try {
        const res = await fetch(currentZoneURL + '?t=' + Date.now());
        if (!res.ok) {
            throw new Error(`HTTP error! status: ${res.status}`);
        }
        const html = await res.text();

        if (!zoneFrame || !document.getElementById('zoneFrame')) {
            zoneFrame = document.createElement('iframe');
            zoneFrame.id = 'zoneFrame';
            zoneFrame.style.width = '100%';
            zoneFrame.style.height = '100%';
            zoneFrame.style.border = 'none';
            if (zoneViewer) zoneViewer.appendChild(zoneFrame);
        }

        const doc = zoneFrame.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();

        if (zoneNameEl) zoneNameEl.textContent = game.title || 'Untitled';
        if (zoneIdEl) zoneIdEl.textContent = String(game.id || '');
        if (zoneAuthorEl) {
            zoneAuthorEl.textContent = game.author ? `by ${game.author}` : '';
            zoneAuthorEl.style.display = game.author ? 'inline' : 'none';
        }

        if (zoneViewer) {
            zoneViewer.style.display = 'flex';
            zoneViewer.setAttribute('aria-hidden', 'false');
        }
        document.body.style.overflow = 'hidden';
        
        try { 
            const u = new URL(window.location); 
            u.searchParams.set('id', game.id); 
            history.pushState(null, '', u.toString()); 
        } catch(e) {}
    } catch (err) {
        console.error('openZone error:', err);
        alert(`Failed to load game: ${game.title}\nURL: ${currentZoneURL}\nError: ${err.message}`);
        
        if (zoneViewer) { 
            zoneViewer.style.display = 'flex'; 
            zoneViewer.setAttribute('aria-hidden', 'false'); 
        }
        if (zoneFrame && zoneFrame.contentWindow && zoneFrame.contentWindow.document) {
            zoneFrame.contentWindow.document.body.innerHTML = `
                <div style="color:white;padding:2rem;text-align:center;font-family:sans-serif;">
                    <h2>Failed to load game</h2>
                    <p>${game.title}</p>
                    <p style="font-size:0.9em;color:#aaa;">URL: ${currentZoneURL}</p>
                    <p style="font-size:0.9em;color:#f88;">Error: ${err.message}</p>
                </div>`;
        }
    }
}

function closeZone() {
    if (zoneViewer) zoneViewer.style.display = 'none';
    zoneViewer?.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (zoneFrame && zoneFrame.parentNode) { 
        try { zoneFrame.parentNode.removeChild(zoneFrame); } catch(e) {} 
    }
    zoneFrame = null;
    currentZoneURL = '';
    try { 
        const u = new URL(window.location); 
        u.searchParams.delete('id'); 
        history.pushState(null,'',u.toString()); 
    } catch(e) {}
}

function fullscreenZone() {
    if (!zoneFrame) return;
    if (zoneFrame.requestFullscreen) {
        zoneFrame.requestFullscreen();
    } else if (zoneFrame.mozRequestFullScreen) {
        zoneFrame.mozRequestFullScreen();
    } else if (zoneFrame.webkitRequestFullscreen) {
        zoneFrame.webkitRequestFullscreen();
    } else if (zoneFrame.msRequestFullscreen) {
        zoneFrame.msRequestFullscreen();
    }
}

// Keyboard controls
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeZone();
    }
});
</script>

<!-- Search -->
<script>
const searchInput = document.getElementById("gameSearch");
const searchWrapper = document.getElementById("searchWrapper");
const searchSlider = document.getElementById("searchSlider");
const searchTitle = document.getElementById("searchTitle");

searchInput.addEventListener("input", () => {
    const query = searchInput.value.toLowerCase().trim();

    // Clear previous results
    searchSlider.innerHTML = "";

    if (!query) {
        searchWrapper.style.display = "none";
        return;
    }

    // Filter games
    const startsWith = allGames.filter(g => g.title.toLowerCase().startsWith(query));
    const contains = allGames.filter(
        g => !g.title.toLowerCase().startsWith(query) && g.title.toLowerCase().includes(query)
    );
    const matches = [...startsWith, ...contains];

    if (matches.length === 0) {
        searchWrapper.style.display = "none";
        return;
    }

    // Show search wrapper and title
    searchWrapper.style.display = "flex";
    searchTitle.style.display = "block";

    // Append all matches instantly
    matches.forEach(game => {
        const card = document.createElement("div");
        card.className = "slide"; // keep existing styling
        card.onclick = () => openZone(game);

        let tagHTML = "";
        if (game.tag === "hot") tagHTML = `<a class="hotrank"><i class='bx bxs-hot'></i>HOT</a>`;
        if (game.tag === "new") tagHTML = `<a class="newrank"><i class='bx bxs-zap'></i>NEW</a>`;

        card.innerHTML = `${tagHTML}<img src="${game.img}" alt="${game.title}">`;

        // Make card visible immediately
        card.style.display = "inline-block"; // forces visible
        card.style.opacity = "1"; // ignore any fade animation

        searchSlider.appendChild(card);
    });

    // Ensure container shows all cards as a grid instead of slider
    searchSlider.style.display = "flex";
    searchSlider.style.flexWrap = "wrap";
    searchSlider.style.justifyContent = "flex-start";
    searchSlider.style.overflow = "visible"; // disables scroll/lazy hiding
});

searchInput.disabled=false;
</script>

<script>
function openGameById(id) {
  const game = allGames.find(g => String(g.id) === String(id));
  if (!game) {
    console.error("Game not found with id:", id);
    return;
  }
  openZone(game);
}
</script>
