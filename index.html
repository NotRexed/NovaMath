<!-- Settings Logic -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const settingsOverlay = document.getElementById('settingsOverlay');
  const closeSettingsBtn = document.getElementById('closeSettings');
  const settingsNavLink = document.getElementById('settingsNavLink');
  const tabCloakBtn = document.getElementById('tab-cloak');
  const customizeBackgroundBtn = document.getElementById('customize-background');
  const resetBackgroundBtn = document.getElementById('reset-background');

  function openOverlay() {
    if (!settingsOverlay) return;
    settingsOverlay.classList.add('active');
    settingsOverlay.setAttribute('aria-hidden','false');
  }

  function closeOverlay() {
    if (!settingsOverlay) return;
    settingsOverlay.classList.remove('active');
    settingsOverlay.setAttribute('aria-hidden','true');
  }

  settingsNavLink?.addEventListener('click', (e) => {
    e.preventDefault();
    openOverlay();
  });

  closeSettingsBtn?.addEventListener('click', closeOverlay);
  settingsOverlay?.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) closeOverlay();
  });

  function restoreTabCloak() {
    const savedTitle = localStorage.getItem("tabCloakTitle");
    const savedFavicon = localStorage.getItem("tabCloakFavicon");
    if (savedTitle) document.title = savedTitle;
    if (savedFavicon) {
      let favicon = document.querySelector("link[rel~='icon']");
      if (!favicon) {
        favicon = document.createElement("link");
        favicon.rel = "icon";
        document.head.appendChild(favicon);
      }
      favicon.href = savedFavicon;
    }
  }
  restoreTabCloak();

  tabCloakBtn?.addEventListener("click", () => {
    const newTitle = prompt("Enter new tab title:", document.title);
    if (newTitle !== null) {
      document.title = newTitle;
      localStorage.setItem("tabCloakTitle", newTitle);
    }

    const newFavicon = prompt("Enter new tab image URL (leave empty to keep current):", "");
    if (newFavicon !== null && newFavicon.trim() !== "") {
      let favicon = document.querySelector("link[rel~='icon']");
      if (!favicon) {
        favicon = document.createElement("link");
        favicon.rel = "icon";
        document.head.appendChild(favicon);
      }
      favicon.href = newFavicon;
      localStorage.setItem("tabCloakFavicon", newFavicon);
    }
  });

  function applyBackgroundGradient(color1, color2, color3) {
    document.documentElement.style.setProperty('--bg-color-1', color1);
    document.documentElement.style.setProperty('--bg-color-2', color2);
    document.documentElement.style.setProperty('--bg-color-3', color3);
    localStorage.setItem('bgColor1', color1);
    localStorage.setItem('bgColor2', color2);
    localStorage.setItem('bgColor3', color3);
  }

  function restoreBackgroundGradient() {
    const color1 = localStorage.getItem('bgColor1');
    const color2 = localStorage.getItem('bgColor2');
    const color3 = localStorage.getItem('bgColor3');
    if (color1 && color2 && color3) {
      document.documentElement.style.setProperty('--bg-color-1', color1);
      document.documentElement.style.setProperty('--bg-color-2', color2);
      document.documentElement.style.setProperty('--bg-color-3', color3);
    }
  }
  restoreBackgroundGradient();

  customizeBackgroundBtn?.addEventListener('click', () => {
    // Close the settings overlay
    closeOverlay();
    
    const pickerContainer = document.createElement('div');
    pickerContainer.style.cssText = `
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 1rem;
      z-index: 10002;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      color: white;
      font-family: sans-serif;
      max-width: 400px;
      width: 90%;
    `;

    const savedColor1 = localStorage.getItem('bgColor1') || '#0a0a0a';
    const savedColor2 = localStorage.getItem('bgColor2') || '#1a1a2e';
    const savedColor3 = localStorage.getItem('bgColor3') || '#16213e';

    pickerContainer.innerHTML = `
      <h3 style="margin-top: 0;">Customize Background Gradient</h3>
      <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 1rem;">This gradient is also applied to the scrollbar</p>
      <div style="margin: 1rem 0;">
        <label style="display: block; margin-bottom: 0.5rem;">Color 1 (Top Left):</label>
        <input type="color" id="bgColor1" value="${savedColor1}" style="width: 100%; height: 40px; cursor: pointer; border: none; border-radius: 5px;">
      </div>
      <div style="margin: 1rem 0;">
        <label style="display: block; margin-bottom: 0.5rem;">Color 2 (Middle):</label>
        <input type="color" id="bgColor2" value="${savedColor2}" style="width: 100%; height: 40px; cursor: pointer; border: none; border-radius: 5px;">
      </div>
      <div style="margin: 1rem 0;">
        <label style="display: block; margin-bottom: 0.5rem;">Color 3 (Bottom Right):</label>
        <input type="color" id="bgColor3" value="${savedColor3}" style="width: 100%; height: 40px; cursor: pointer; border: none; border-radius: 5px;">
      </div>
      <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
        <button id="applyBgColors" style="flex: 1; padding: 0.7rem; background: #4CAF50; border: none; border-radius: 5px; color: white; cursor: pointer; font-weight: bold;">Apply</button>
        <button id="cancelBgColors" style="flex: 1; padding: 0.7rem; background: #f44336; border: none; border-radius: 5px; color: white; cursor: pointer; font-weight: bold;">Cancel</button>
      </div>
    `;

    document.body.appendChild(pickerContainer);

    const color1Input = pickerContainer.querySelector('#bgColor1');
    const color2Input = pickerContainer.querySelector('#bgColor2');
    const color3Input = pickerContainer.querySelector('#bgColor3');
    
    const updatePreview = () => {
      document.documentElement.style.setProperty('--bg-color-1', color1Input.value);
      document.documentElement.style.setProperty('--bg-color-2', color2Input.value);
      document.documentElement.style.setProperty('--bg-color-3', color3Input.value);
    };

    color1Input.addEventListener('input', updatePreview);
    color2Input.addEventListener('input', updatePreview);
    color3Input.addEventListener('input', updatePreview);

    pickerContainer.querySelector('#applyBgColors').addEventListener('click', () => {
      applyBackgroundGradient(color1Input.value, color2Input.value, color3Input.value);
      document.body.removeChild(pickerContainer);
    });

    pickerContainer.querySelector('#cancelBgColors').addEventListener('click', () => {
      restoreBackgroundGradient();
      document.body.removeChild(pickerContainer);
    });

    const escapeHandler = (e) => {
      if (e.key === 'Escape' && document.body.contains(pickerContainer)) {
        restoreBackgroundGradient();
        document.body.removeChild(pickerContainer);
        document.removeEventListener('keydown', escapeHandler);
      }
    };
    document.addEventListener('keydown', escapeHandler);
  });

  resetBackgroundBtn?.addEventListener('click', () => {
    applyBackgroundGradient('#0a0a0a', '#1a1a2e', '#16213e');
    alert('Background gradient reset to default!');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeOverlay();
    }
  });
});
</script>

<!-- Optimized Games System with jsDelivr Stats -->
<script>
let allGames = [];
const coverURL = "https://cdn.jsdelivr.net/gh/Notrexed/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/Notrexed/html@main";

let _allStatsCache = null;
let _statsFetchPromise = null;

// Clear old caches on load
if (typeof localStorage !== 'undefined') {
    localStorage.removeItem('novaStatsCache_v2');
    localStorage.removeItem('novaStatsCache_v3');
    console.log('Cleared old cache versions');
}

function loadCachedStats() {
    try {
        const cached = localStorage.getItem('novaStatsCache_v4');
        if (!cached) return null;
        const data = JSON.parse(cached);
        const now = Date.now();
        const oneHour = 1 * 60 * 60 * 1000;
        if (!data.timestamp || !data.stats || (now - data.timestamp) > oneHour) {
            localStorage.removeItem('novaStatsCache_v4');
            return null;
        }
        // Don't use cache if it has 0 games (indicates bad data)
        const gameCount = Object.keys(data.stats).length;
        if (gameCount === 0) {
            console.log('Cache has 0 games, clearing and forcing fresh fetch');
            localStorage.removeItem('novaStatsCache_v4');
            return null;
        }
        return data.stats;
    } catch (e) {
        return null;
    }
}

function saveCachedStats(stats) {
    try {
        localStorage.setItem('novaStatsCache_v4', JSON.stringify({
            timestamp: Date.now(),
            stats: stats
        }));
    } catch (e) {
        console.warn('Failed to cache stats:', e);
    }
}

async function getAllStats(forceRefresh = false) {
    console.log('getAllStats called, forceRefresh:', forceRefresh);
    
    if (!forceRefresh && _allStatsCache) {
        console.log('Returning cached stats:', Object.keys(_allStatsCache).length, 'games');
        // Update UI with cached stats
        requestAnimationFrame(() => updateAllPlayCounts());
        return _allStatsCache;
    }
    if (!forceRefresh) {
        const cached = loadCachedStats();
        if (cached) {
            console.log('Loaded from localStorage:', Object.keys(cached).length, 'games');
            _allStatsCache = cached;
            // Update UI with cached stats
            requestAnimationFrame(() => updateAllPlayCounts());
            return cached;
        }
    }
    if (_statsFetchPromise) {
        console.log('Already fetching stats, returning existing promise');
        return _statsFetchPromise;
    }
    
    console.log('Starting fresh stats fetch...');
    
    _statsFetchPromise = (async () => {
        const combinedMap = Object.create(null);
        
        try {
            const baseURL = 'https://data.jsdelivr.com/v1/stats/packages/gh/NotRexed/html@main/files';
            let page = 1;
            let hasMorePages = true;
            
            while (hasMorePages && page <= 10) {
                const url = `${baseURL}?period=all&page=${page}`;
                console.log('Fetching page', page, ':', url);
                
                const response = await fetch(url);
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    console.log('Failed to fetch page', page);
                    break;
                }
                
                const data = await response.json();
                
                if (!Array.isArray(data) || data.length === 0) {
                    console.log('No more data on page', page);
                    hasMorePages = false;
                    break;
                }
                
                console.log('Processing', data.length, 'files from page', page);
                
                for (const item of data) {
                    if (!item.name) continue;
                    
                    // Extract filename from path
                    const filename = item.name.split('/').pop();
                    
                    // Extract game ID from filename (e.g., "542.html" or "542-baldis-basics.html")
                    const match = filename.match(/^(\d+)[-.]?/);
                    if (match) {
                        const id = match[1];
                        const hits = item.hits?.total || 0;
                        
                        if (!combinedMap[id]) {
                            combinedMap[id] = { hits: 0 };
                        }
                        combinedMap[id].hits += hits;
                    }
                }
                
                page++;
            }
            
            console.log('Final stats loaded:', Object.keys(combinedMap).length, 'games');
            console.log('Sample stats:', Object.entries(combinedMap).slice(0, 10));
        } catch (err) {
            console.error('Stats fetch error:', err);
        }
        
        _allStatsCache = combinedMap;
        saveCachedStats(combinedMap);
        _statsFetchPromise = null;
        
        requestAnimationFrame(() => updateAllPlayCounts());
        
        return combinedMap;
    })();
    
    return _statsFetchPromise;
}

async function getStats(id) {
    id = String(id);
    const allStats = await getAllStats();
    return allStats[id]?.hits ?? 0;
}

function formatPlays(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
    return num > 0 ? num.toString() : '...';
}

let updateTimeout = null;
function updateAllPlayCounts() {
    if (updateTimeout) return;
    
    updateTimeout = setTimeout(async () => {
        const cards = document.querySelectorAll('.slide[data-game-id]');
        
        const batchSize = 20;
        for (let i = 0; i < cards.length; i += batchSize) {
            const batch = Array.from(cards).slice(i, i + batchSize);
            
            await Promise.all(batch.map(async card => {
                const gameId = card.getAttribute('data-game-id');
                const playsEl = card.querySelector('.game-plays span');
                if (playsEl && gameId) {
                    const plays = await getStats(gameId);
                    playsEl.textContent = formatPlays(plays);
                }
            }));
            
            await new Promise(resolve => setTimeout(resolve, 0));
        }
        
        updateTimeout = null;
    }, 100);
}

async function loadGamesGrid() {
    try {
        const res = await fetch("https://cdn.jsdelivr.net/gh/NotRexed/assets@latest/allzone.json");
        if (!res.ok) throw new Error('Failed to fetch games');
        const rawGames = await res.json();

        allGames = rawGames.map(g => ({
            id: g.id,
            title: g.name,
            img: g.cover.replace("{COVER_URL}", coverURL),
            url: g.url.replace("{HTML_URL}", htmlURL),
            tag: g.tag || null,
            author: g.author || "Unknown",
            featured: g.featured || false
        }));

        allGames.sort((a,b) => a.title.localeCompare(b.title));

        const featuredContainer = document.querySelector("#featuredGames .grid-container");
        const allContainer = document.querySelector("#allGames .grid-container");

        featuredContainer.innerHTML = "";
        allContainer.innerHTML = "";

        const createOptimizedCard = (game) => {
            const card = document.createElement("div");
            card.className = "slide";
            card.setAttribute('data-game-id', game.id);

            let tagHTML = "";
            if(game.tag === "hot") tagHTML = `<a class='hotrank'><i class='bx bxs-hot'></i>HOT</a>`;
            if(game.tag === "new") tagHTML = `<a class='newrank'><i class='bx bxs-zap'></i>NEW</a>`;

            card.innerHTML = `
        ${tagHTML}
        <div class="game-card-inner">
            <img src="${game.img}" alt="${game.title}">
            <div class="game-title">
                <span class="game-name">${game.title}</span>
                <div class="game-plays">
                    <i class='bx bx-play-circle'></i>
                    <span>...</span>
                </div>
            </div>
        </div>
    `;
            return card;
        };

        allGames.forEach(game => {
            const allCard = createOptimizedCard(game);
            allContainer.appendChild(allCard);

            if(game.featured) {
                const featuredCard = createOptimizedCard(game);
                featuredContainer.appendChild(featuredCard);
            }
        });

        document.addEventListener('click', (e) => {
            const card = e.target.closest('.slide[data-game-id]');
            if (card) {
                const gameId = card.getAttribute('data-game-id');
                const game = allGames.find(g => String(g.id) === String(gameId));
                if (game) {
                    openZone(game);
                }
            }
        });

        // Fetch stats from jsDelivr API
        getAllStats();
    } catch (err) {
        console.error('Failed to load games:', err);
    }
}

loadGamesGrid();

// Sort functionality
async function sortGames(sortBy) {
    const featuredContainer = document.querySelector("#featuredGames .grid-container");
    const allContainer = document.querySelector("#allGames .grid-container");
    
    // Create a copy to sort
    let sortedGames = [...allGames];
    
    if (sortBy === 'name') {
        sortedGames.sort((a, b) => a.title.localeCompare(b.title));
    } else if (sortBy === 'id') {
        sortedGames.sort((a, b) => a.id - b.id);
    } else if (sortBy === 'popularity') {
        // Get all stats first
        const allStats = await getAllStats();
        
        // Sort by play count (most popular first)
        sortedGames.sort((a, b) => {
            const playsA = allStats[String(a.id)]?.hits || 0;
            const playsB = allStats[String(b.id)]?.hits || 0;
            return playsB - playsA; // Descending order
        });
    }
    
    // Clear containers
    featuredContainer.innerHTML = "";
    allContainer.innerHTML = "";
    
    // Helper function to create cards
    const createOptimizedCard = (game) => {
        const card = document.createElement("div");
        card.className = "slide";
        card.setAttribute('data-game-id', game.id);

        let tagHTML = "";
        if(game.tag === "hot") tagHTML = `<a class='hotrank'><i class='bx bxs-hot'></i>HOT</a>`;
        if(game.tag === "new") tagHTML = `<a class='newrank'><i class='bx bxs-zap'></i>NEW</a>`;

        card.innerHTML = `
            ${tagHTML}
            <div class="game-card-inner">
                <img src="${game.img}" alt="${game.title}">
                <div class="game-title">
                    <span class="game-name">${game.title}</span>
                    <div class="game-plays">
                        <i class='bx bx-play-circle'></i>
                        <span>...</span>
                    </div>
                </div>
            </div>
        `;
        return card;
    };
    
    // Re-render sorted games
    sortedGames.forEach(game => {
        const allCard = createOptimizedCard(game);
        allContainer.appendChild(allCard);

        if(game.featured) {
            const featuredCard = createOptimizedCard(game);
            featuredContainer.appendChild(featuredCard);
        }
    });
    
    // Update play counts
    updateAllPlayCounts();
}

// Add event listener for sort dropdown
document.addEventListener('DOMContentLoaded', () => {
    const sortDropdown = document.getElementById('sortDropdown');
    if (sortDropdown) {
        sortDropdown.addEventListener('change', (e) => {
            sortGames(e.target.value);
        });
    }
});
</script>

<!-- Optimized Zone Viewer -->
<script>
let zoneFrame = null;
const zoneViewer = document.getElementById('zoneViewer');
const zoneNameEl = document.getElementById('zoneName');
const zoneIdEl = document.getElementById('zoneId');
const zoneAuthorEl = document.getElementById('zoneAuthor');
let currentZoneURL = '';

async function openZone(game) {
    if (!game) return;
    
    currentZoneURL = game.url;
    
    console.log("Opening game:", game.title);
    console.log("Game URL:", currentZoneURL);
    
    try {
        // Get the existing iframe
        zoneFrame = document.getElementById('zoneFrame');
        
        if (!zoneFrame) {
            console.error('Zone frame not found!');
            return;
        }

        // Fetch the HTML content
        const res = await fetch(currentZoneURL + '?t=' + Date.now());
        if (!res.ok) {
            throw new Error(`HTTP error! status: ${res.status}`);
        }
        const html = await res.text();

        // Write HTML to iframe
        const doc = zoneFrame.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();

        if (zoneNameEl) zoneNameEl.textContent = game.title || 'Untitled';
        if (zoneIdEl) zoneIdEl.textContent = String(game.id || '');
        if (zoneAuthorEl) {
            zoneAuthorEl.textContent = game.author ? `by ${game.author}` : '';
            zoneAuthorEl.style.display = game.author ? 'inline' : 'none';
        }

        if (zoneViewer) {
            zoneViewer.style.display = 'flex';
            zoneViewer.setAttribute('aria-hidden', 'false');
        }
        document.body.style.overflow = 'hidden';
        
        try { 
            const u = new URL(window.location); 
            u.searchParams.set('id', game.id); 
            history.pushState(null, '', u.toString()); 
        } catch(e) {}
    } catch (err) {
        console.error('openZone error:', err);
        alert(`Failed to load game: ${game.title}\nURL: ${currentZoneURL}\nError: ${err.message}`);
    }
}

function closeZone() {
    if (zoneViewer) {
        zoneViewer.style.display = 'none';
        zoneViewer.setAttribute('aria-hidden', 'true');
    }
    
    document.body.style.overflow = '';
    
    zoneFrame = document.getElementById('zoneFrame');
    if (zoneFrame) {
        try {
            zoneFrame.src = 'about:blank';
            if (zoneFrame.contentWindow) {
                const doc = zoneFrame.contentWindow.document;
                doc.open();
                doc.close();
            }
        } catch(e) {
            console.warn('Iframe cleanup error:', e);
        }
    }
    
    currentZoneURL = '';
    
    try { 
        const u = new URL(window.location); 
        u.searchParams.delete('id'); 
        history.pushState(null,'',u.toString()); 
    } catch(e) {}
}

function fullscreenZone() {
    if (!zoneFrame) return;
    if (zoneFrame.requestFullscreen) {
        zoneFrame.requestFullscreen();
    } else if (zoneFrame.mozRequestFullScreen) {
        zoneFrame.mozRequestFullScreen();
    } else if (zoneFrame.webkitRequestFullscreen) {
        zoneFrame.webkitRequestFullscreen();
    } else if (zoneFrame.msRequestFullscreen) {
        zoneFrame.msRequestFullscreen();
    }
}

function openInAboutBlank() {
    if (!currentZoneURL) {
        console.error('No game URL available');
        return;
    }
    
    // Open about:blank window
    const win = window.open('about:blank', '_blank');
    
    if (!win) {
        alert('Please allow popups for this site');
        return;
    }
    
    // Fetch the game HTML
    fetch(currentZoneURL + '?t=' + Date.now())
        .then(res => res.text())
        .then(html => {
            // Write the game HTML to the new window
            win.document.open();
            win.document.write(html);
            win.document.close();
        })
        .catch(err => {
            console.error('Failed to load game in about:blank:', err);
            win.close();
            alert('Failed to open game in about:blank');
        });
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeZone();
        const settingsOverlay = document.getElementById('settingsOverlay');
        if (settingsOverlay && settingsOverlay.classList.contains('active')) {
            settingsOverlay.classList.remove('active');
            settingsOverlay.setAttribute('aria-hidden','true');
        }
    }
});
</script>

<!-- Onboarding Animation Script -->
<script>
class ImageCacheManager {
  constructor() {
    this.cacheKey = 'novaImageCache_v1';
    this.cacheTimestamp = 'novaCacheTimestamp_v1';
    this.loadedKey = 'novaImagesLoaded_v1';
  }

  getCachedImages() {
    try {
      const cached = localStorage.getItem(this.cacheKey);
      const timestamp = localStorage.getItem(this.cacheTimestamp);
      const loaded = localStorage.getItem(this.loadedKey);
      
      if (!cached || !timestamp || !loaded) return null;
      
      return {
        images: JSON.parse(cached),
        timestamp: parseInt(timestamp),
        loaded: loaded === 'true'
      };
    } catch (e) {
      return null;
    }
  }

  setCachedImages(images) {
    try {
      localStorage.setItem(this.cacheKey, JSON.stringify(images));
      localStorage.setItem(this.cacheTimestamp, Date.now().toString());
      localStorage.setItem(this.loadedKey, 'true');
    } catch (e) {
      console.warn('Failed to cache images:', e);
    }
  }

  clearCache() {
    localStorage.removeItem(this.cacheKey);
    localStorage.removeItem(this.cacheTimestamp);
    localStorage.removeItem(this.loadedKey);
  }

  needsReload() {
    const cache = this.getCachedImages();
    if (!cache) return true;
    
    if (cache.loaded) {
      const twentyFourHours = 24 * 60 * 60 * 1000;
      const now = Date.now();
      
      const isHardReload = performance && (
        performance.navigation?.type === 1 || 
        performance.getEntriesByType?.('navigation')?.[0]?.type === 'reload'
      );
      
      const cacheExpired = (now - cache.timestamp) > twentyFourHours;
      
      return cacheExpired && isHardReload;
    }
    
    return true;
  }
}

class ImagePreloader {
  constructor() {
    this.totalImages = 0;
    this.loadedImages = 0;
    this.images = [];
    this.cacheManager = new ImageCacheManager();
  }

  async preloadAllImages() {
    await this.waitForGames();
    
    const gameImages = new Set();
    
    document.querySelectorAll('.slide img, .bannerimage, img[src]').forEach(img => {
      if (img.src && !img.src.includes('data:') && !img.src.includes('blob:')) {
        gameImages.add(img.src);
      }
    });

    const imageArray = Array.from(gameImages);
    this.totalImages = imageArray.length;
    
    if (this.totalImages === 0) {
      return Promise.resolve();
    }

    return new Promise((resolve) => {
      let completed = 0;
      
      imageArray.forEach(src => {
        const img = new Image();
        
        const handleComplete = () => {
          completed++;
          this.imageLoaded(resolve, completed, imageArray.length);
        };
        
        img.onload = handleComplete;
        img.onerror = handleComplete;
        img.src = src;
        this.images.push(img);
      });
      
      this.cacheManager.setCachedImages(imageArray);
    });
  }

  waitForGames() {
    return new Promise((resolve) => {
      const checkGames = () => {
        if (typeof allGames !== 'undefined' && allGames && allGames.length > 0) {
          resolve();
        } else {
          setTimeout(checkGames, 100);
        }
      };
      checkGames();
    });
  }

  imageLoaded(resolve, loaded, total) {
    const progress = (loaded / total) * 100;
    this.updateProgress(progress);
    
    if (loaded >= total) {
      resolve();
    }
  }

  updateProgress(percentage) {
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('loadingProgress');
    
    if (progressBar) {
      progressBar.style.width = percentage + '%';
    }
    
    if (progressText) {
      progressText.textContent = `Loading... ${Math.round(percentage)}%`;
    }
  }
}

const cacheManager = new ImageCacheManager();
const shouldShowAnimation = cacheManager.needsReload();

if (shouldShowAnimation) {
  console.log('Loading animation: Images need to be loaded');
  
  document.body.classList.add('loading-active');
  document.body.style.overflow = 'hidden';
  
  function startNovaAnimation() {
    const timeline = gsap.timeline({
      onComplete: async function() {
        const preloader = new ImagePreloader();
        
        gsap.to('#loadingProgress', { opacity: 1, duration: 0.5 });
        gsap.to('#progressBarContainer', { opacity: 1, duration: 0.5 });
        
        await preloader.preloadAllImages();
        await new Promise(resolve => setTimeout(resolve, 500));
        
        performFadeToBlackEnding();
      }
    });

    timeline
      .fromTo('.letter-n', {
        x: -150,
        opacity: 0
      }, {
        x: 0,
        opacity: 1,
        duration: 1.5,
        ease: 'expo.inOut'
      })
      .fromTo('.letter-o', {
        y: -200,
        opacity: 0
      }, {
        y: 0,
        opacity: 1,
        duration: 1,
        ease: 'expo.inOut'
      }, '-=1.0')
      .fromTo('.letter-v', {
        y: 200,
        opacity: 0
      }, {
        y: 0,
        opacity: 1,
        duration: 1.5,
        ease: 'expo.inOut'
      }, '-=1.0')
      .fromTo('.letter-a', {
        x: 140,
        opacity: 0
      }, {
        x: 0,
        opacity: 1,
        duration: 1.5,
        ease: 'expo.inOut'
      }, '-=1.0');

    return timeline;
  }

  function performFadeToBlackEnding() {
    const overlay = document.getElementById('loadingOverlay');
    
    const endTimeline = gsap.timeline({
      onComplete: function() {
        overlay.style.display = 'none';
        document.body.style.overflow = '';
        document.body.classList.remove('loading-active');
      }
    });

    endTimeline
      .to('.nova-letter, #loadingProgress, #progressBarContainer', {
        opacity: 0,
        duration: 0.8,
        ease: 'power2.inOut'
      })
      .to({}, { duration: 0.4 })
      .to(overlay, {
        opacity: 0,
        duration: 1.2,
        ease: 'power2.inOut'
      });
  }

  if (typeof gsap !== 'undefined') {
    startNovaAnimation();
  } else {
    const checkGSAP = setInterval(() => {
      if (typeof gsap !== 'undefined') {
        clearInterval(checkGSAP);
        startNovaAnimation();
      }
    }, 100);
  }
} else {
  console.log('Loading animation: Skipped (images cached)');
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) {
    overlay.style.display = 'none';
  }
}
</script>
